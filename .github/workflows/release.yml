name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, like 1.0.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 1.0.0, got '$VERSION'" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: |
          for package in packages/*; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done
          bun install

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: release $VERSION"
          git tag "$VERSION" 2>/dev/null || true
          git push origin HEAD:main "$VERSION"

      - run: |
          for package in core headscale tailscale tailscaled tailcat; do
            (
              cd "packages/$package"
              name=$(npm pkg get name | tr -d '"')
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                echo "$name@$VERSION is already on npm"
                exit 0
              fi
              if [ "$(npm pkg get 'dependencies.@tailnet/core' | tr -d '"')" = "workspace:*" ]; then
                npm pkg set "dependencies.@tailnet/core=$VERSION"
              fi
              npm publish --access public
            )
          done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
